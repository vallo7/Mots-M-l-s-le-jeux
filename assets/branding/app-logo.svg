    <rect x="24" y="24" width="18" height="18" rx="4.5" fill="#2B2A33"/><rect x="45" y="24" width="18" height="18" rx="4.5" fill="#FFFFFF"/><rect x="66" y="24" width="18" height="18" rx="4.5" fill="#FFFFFF"/>
    <rect x="24" y="45" width="18" height="18" rx="4.5" fill="#FFFFFF"/><rect x="45" y="45" width="18" height="18" rx="4.5" fill="#2B2A33"/><rect x="66" y="45" width="18" height="18" rx="4.5" fill="#FFFFFF"/>
    <rect x="24" y="66" width="18" height="18" rx="4.5" fill="#FFFFFF"/><rect x="45" y="66" width="18" height="18" rx="4.5" fill="#FFFFFF"/><rect x="66" y="66" width="18" height="18" rx="4.5" fill="#2B2A33"/>
  </g>
