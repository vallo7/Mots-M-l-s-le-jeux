name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show tested commit and key files
        run: |
          echo "Commit testé : $GITHUB_SHA (réf : $GITHUB_REF_NAME)"
          git log -1 --format='%h  %an  %s' || true
          echo "Fichiers suivis par Git : $(git ls-files | wc -l)"
          echo "--- sons de praise :"; ls -la app/src/main/assets/audio/praise 2>&1 | head -20
          echo "--- sons d'interface :"; ls -la app/src/main/assets/audio/ui 2>&1 | head -20

      - name: Remove placeholder files (.gitkeep)
        run: find . -name .gitkeep -not -path './.git/*' -print -delete

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check expected files, secrets and motion rules
        run: python3 scripts/check_repo.py

      - name: Check Android resources (FR/EN parity, references, hard-coded text)
        run: python3 scripts/check_resources.py

      - name: Validate level data (rules + reproducibility)
        run: |
          python3 scripts/validate_levels.py
          python3 scripts/generate_levels.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (dependency cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Lint and unit tests
        run: ./gradlew --no-daemon --stacktrace :domain:test :app:lintDebug :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: word-game-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: word-game-build-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
